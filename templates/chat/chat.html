{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<h4>💬 Conversa</h4>

<div class="card p-3 mb-3" style="height:400px; overflow-y:auto;">

{% for msg in mensagens %}

<div style="margin-bottom:10px;">

<strong>
{{ msg.remetente.username }}
</strong>:

{{ msg.texto }}

</div>

{% endfor %}

</div>

<form method="POST">
{% csrf_token %}

<div class="d-flex gap-2">

<input type="text" name="mensagem" class="form-control" placeholder="Digite sua mensagem...">

<button class="btn btn-primary">
Enviar
</button>

</div>

</form>

</div>

{% endblock %}
<!-- CHAT FLUTUANTE -->
<div id="chat-box" class="chat-box">

    <div class="chat-header">
        💬 Chat
        <span onclick="fecharChat()" style="cursor:pointer;">✖</span>
    </div>

    <div id="chat-messages" class="chat-messages">
        Carregando...
    </div>

    <form id="chat-form">
        <input type="text" id="chat-input" placeholder="Digite sua mensagem..." required>
        <button type="submit">Enviar</button>
    </form>

</div>
